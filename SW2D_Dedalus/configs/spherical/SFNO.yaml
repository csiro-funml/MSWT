data:
  datapath: '/scratch3/wan410/operator_learning_data/Dedalus/ShallowWater'
  normalizer_path: '/scratch3/wan410/operator_learning_data/Dedalus/ShallowWater/normstat.pt'
  name: SW2D_Dedalus
  nx: 128
  ny: 256
  shuffle: True
  grid_form: spherical
  nt: 359

model:
  name: sfno
  in_chans: 5
  out_chans: 2
  num_layers: 4
  scale_factor: 3
  embed_dim: 16
  # 'spectral' uses internal (h,w)=(43,85) and mismatches encoder output (128,256); use full-resolution pos_embed
  pos_embed: 'none'
  use_mlp: True
  normalization_layer: 'instance_norm'            

train:
  batchsize: 100
  epochs: 500
  milestones: [100, 200, 300, 400]
  base_lr: 0.001
  scheduler_gamma: 0.5
  ic_loss: 0.0
  f_loss: 0.0
  xy_loss: 1.0
  save_dir: /scratch3/wan410/operator_learning_model/SW2D_Dedalus/SFNO2d/
  save_name: SFNO-nlayers4-embed16.pt
  data_iter: 1
  eqn_iter: 0
  eval_step: 10

test_data:
  datapath: '/scratch3/wan410/operator_learning_data/pdearena/sw2d_pda/sw2d_pda_data_val.npy'
  total_num: 100
  nx: 96
  ny: 192
  nt: 87
  sub: 1
  sub_t: 1
  shuffle: False
