data:
  datapath: '/scratch3/wan410/operator_learning_data/Dedalus/Forcing_with_low_freq_energy/dedalus_data_train.npy'
  name: NS2D_Dedalus
  total_num: 10000
  offset: 1000 # skip the first 1000 steps (200s)
  time_interval: 1
  nx: 256
  ny: 256
  nt: 1
  nc: 3 # forcing + vorticity
  sub: 1
  sub_t: 1
  shuffle: True
  S2: 256
  T2: 1
  grid_form: linear

model:
  name: mswt_periodic_patching_residual
  wave: haar
  dims: [16, 16, 32, 64, 128, 256, 512]
  in_chans: 5    # u plus (x,y) grid concatenated in train loop
  out_chans: 1
  use_efficient_attention: True
  efficient_layers: [0, 1, 2, 3, 4, 5]
  residual_connection: True
  patch_size: 2
  local_attention_size: 8

train:
  batchsize: 32
  epochs: 1000
  milestones: [200, 400, 600, 800]
  base_lr: 0.001
  scheduler_gamma: 0.5
  ic_loss: 0.0
  f_loss: 0.0
  xy_loss: 1.0
  save_dir: /scratch3/wan410/operator_learning_model/NS2D_Dedalus/MSWT2d/
  save_name: MultiscaleWavelet2d-dim64-nlayers4.pt
  data_iter: 1
  eqn_iter: 0


test_data:
  datapath: '/scratch3/wan410/operator_learning_data/Dedalus/Forcing_with_low_freq_energy/dedalus_data_test.npy'
  total_num: 10000
  offset: 1000 # skip the first 1000 steps (200s)
  time_interval: 1
  nx: 256
  ny: 256
  nt: 1
  sub: 1
  sub_t: 1
  shuffle: False